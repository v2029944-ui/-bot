name: Checks
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: mypy
      - run: python -m pytest -ra
      - run: sh -n entrypoint.sh
      - run: docker build -t postbot:test .
      - name: Check MAX CA in the packaged image
        run: >-
          docker run --rm --network none --entrypoint python postbot:test
          -c 'import ssl, max_tls; context = max_tls.create_ssl_context(); assert context.verify_mode == ssl.CERT_REQUIRED and context.check_hostname'
