[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# core intentionally re-exports these modules for existing adapters and tests.
"core.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = ["*.py", "services"]
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
